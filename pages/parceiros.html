<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parceiros | Cesae</title>

    <link rel="shortcut icon" href="../images/favicon-cesae.svg" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/parceiros.css">
</head>

<body>

    <section class="container py-5">
        <h1 class="h2 mb-2"> Parceria e certificações</h1>
        <p class="parceiros-intro mb-5"> A qualidade da oferta que temos ao nível da formação e certificações que
            disponibilizamos
            só é possível
            graças
            ao apoio dos nossos parceiros. </p>


        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-4 parceiros-grid">

            <div class="col">
                <a href="https://www.aeportugal.pt/" class="logo-tile" title="AEP">
                    <img src="../images/parceiros/aep.png" alt="Associação Empresarial de Portugal">
                </a>
            </div>

            <div class="col">
                <a href="https://www.autodesk.com/" class="logo-tile" title="Autodesk">
                    <img src="../images/parceiros/autodesk.png" alt="Autodesk">
                </a>
            </div>

            <div class="col">
                <a href="https://aws.amazon.com/pt/training/awsacademy/" class="logo-tile" title="AWS Academy">
                    <img src="../images/parceiros/aws.png" alt="AWS Academy - Member Institution">
                </a>
            </div>

            <div class="col">
                <a href="https://www.checkpoint.com/services/training/secureacademy/" class="logo-tile"
                    title="Check Point SecureAcademy">
                    <img src="../images/parceiros/checkpoint.png" alt="Check Point SecureAcademy - Academic Partner">
                </a>
            </div>

            <div class="col">
                <a href="https://www.cisco.com/site/us/en/learn/training-certifications/training/netacad/index.html"
                    class="logo-tile" title="Cisco Networking Academy">
                    <img src="../images/parceiros/cisco.png" alt="Cisco Networking Academy">
                </a>
            </div>

            <div class="col">
                <a href="https://www.kryterion.com/" class="logo-tile" title="Kryterion">
                    <img src="../images/parceiros/kryterion.png" alt="Kryterion">
                </a>
            </div>

            <div class="col">
                <a href="https://www.meazurelearning.com/" class="logo-tile" title="Meazure">
                    <img src="../images/parceiros/meazure.jpg" alt="Meazure">
                </a>
            </div>

            <div class="col">
                <a href="https://www.pearsonvue.com/" class="logo-tile" title="Pearson VUE">
                    <img src="../images/parceiros/pearson.png" alt="Pearson VUE - Authorised Test Centre">
                </a>
            </div>

            <div class="col">
                <a href="https://www.sage.com/pt-pt/" class="logo-tile" title="Sage">
                    <img src="../images/parceiros/sage.png" alt="Sage">
                </a>
            </div>

        </div>

    </section>

</body>

</html>
